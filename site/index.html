<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk — 想法文档站</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">想法 · 随笔 · 讨论</p>
    <h1>Talk</h1>
    <p class="lead">一个用于<strong>交流想法</strong>的文档仓库。记录灵感、项目构想与开放讨论，成熟后可孵化到独立仓库继续开发。</p>
    <div class="hero-actions">
      <a class="btn primary" href="https://github.com/jk9988610/Talk/tree/main/docs">浏览文档</a>
      <a class="btn" href="https://github.com/jk9988610/Talk/blob/main/CONTRIBUTING.md">贡献指南</a>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>文档分类</h2>
      <div class="grid" id="categories"></div>
    </section>

    <section>
      <h2>已孵化项目</h2>
      <p class="section-desc">从本仓库构想出发、在独立仓库中继续实现的项目。完整目录见
        <a href="https://github.com/jk9988610/Talk/blob/main/docs/07-projects/2026-08-22-作品仓库总览与导航.md">作品仓库总览</a>。
      </p>
      <div class="grid projects" id="projects"></div>
    </section>

    <section>
      <h2>如何参与</h2>
      <ol class="steps">
        <li>在 <code>docs/</code> 对应分类下新建 Markdown 文档</li>
        <li>复制 <a href="https://github.com/jk9988610/Talk/tree/main/templates">templates/</a> 中的写作模板</li>
        <li>通过 Pull Request 或 <a href="https://github.com/jk9988610/Talk/issues/new/choose">Issue</a> 参与讨论</li>
      </ol>
    </section>
  </main>

  <footer class="footer">
    <p>
      <a href="https://github.com/jk9988610/Talk">GitHub 仓库</a> ·
      内容默认 <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
